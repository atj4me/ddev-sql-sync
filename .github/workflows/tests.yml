# This workflow is standard for DDEV add-ons
# It's generated and maintained by the ddev/addon-maintenance-action
name: tests
on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  schedule:
    - cron: '25 08 * * *'
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: Enable remote debugging session
        required: false
        default: false

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g bats
      - run: bats tests/unit.bats

  tests:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            ddev_version: "stable"
          - os: ubuntu-latest
            ddev_version: "HEAD"
          - os: ubuntu-24.04-arm
            ddev_version: "stable"
          - os: ubuntu-24.04-arm
            ddev_version: "HEAD"
      fail-fast: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: ddev/github-action-add-on-test@v2
        with:
          ddev_version: ${{ matrix.ddev_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          debug_enabled: ${{ github.event.inputs.debug_enabled }}
          addon_repository: ${{ env.GITHUB_REPOSITORY }}
          addon_ref: ${{ env.GITHUB_REF }}
